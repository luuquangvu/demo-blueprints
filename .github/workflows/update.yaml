name: Update Blueprints

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Simulation mode / Phase"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "occupancy_change"
          - "occupancy_safe"
          - "motion_change"
          - "motion_safe"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Rotate and update blueprint
        id: update_blueprint
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python scripts/update_blueprint.py "$MODE" "blueprints/motion_light_blueprint.yaml"

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git add blueprints/motion_light_blueprint.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${{ steps.update_blueprint.outputs.COMMIT_TITLE }}" -m "${{ steps.update_blueprint.outputs.COMMIT_BODY }}"
            git pull --rebase origin main
            git push origin main
          fi
