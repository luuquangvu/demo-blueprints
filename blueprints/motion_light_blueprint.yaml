blueprint:
  name: Motion-Activated Light/Switch (Frequent Updates)
  description: |-
    A simple blueprint that turns on a light or switch when motion is detected and turns it off when motion stops. This file is updated frequently to simulate new releases.

    Changelog:
    - Phase 4/4: Safe update (device_class: motion)
      device_class: motion
      update_id: 5f55f5aa-3160-49d1-af60-70aa512df2b7
      updated: 2026-10-17 02:03 UTC
  author: luuquangvu
  domain: automation
  source_url: https://github.com/luuquangvu/demo-blueprints/blob/main/blueprints/motion_light_blueprint.yaml
  homeassistant:
    min_version: 2024.12.0
  input:
    motion_sensor:
      name: Motion Sensor
      description: The binary sensor that detects motion.
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    target_entity:
      name: Target Light/Switch
      description: The light or switch to control.
      selector:
        target:
          entity:
            domain:
              - light
              - switch

mode: single
max_exceeded: silent
variables:
  update_id: 5f55f5aa-3160-49d1-af60-70aa512df2b7
  last_updated: "2026-10-17 02:03 UTC"

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    from:
      - "on"
      - "off"
    to:
      - "off"
      - "on"
actions:
  - action: "homeassistant.turn_{{ trigger.to_state.state }}"
    target: !input target_entity
